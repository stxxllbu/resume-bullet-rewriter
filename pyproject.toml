[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-bullet-rewriter"
version = "0.1.0"
description = "CLI for rewriting resume bullets with rules, LLM backends, and JD-aware agent pipeline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
resume-rewrite = "resume_rewriter.main:main"
resume-bench = "resume_rewriter.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
